# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

  # Environment variables - Add your secrets in Firebase Console
  # https://console.firebase.google.com/project/agents-473403/apphosting
  # NOTE: Add these as SECRETS in Firebase Console for sensitive values:
  # - GEMINI_API_KEY
  # - GOOGLE_SEARCH_API_KEY
  # - NEXT_PUBLIC_FIREBASE_API_KEY
  env:
    - variable: GOOGLE_CLOUD_PROJECT_ID
      value: agents-473403
    - variable: GOOGLE_CLOUD_LOCATION
      value: us-central1
    - variable: BIGQUERY_DATASET_ID
      value: startup_benchmarks
    - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
      value: agents-473403
    - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      value: agents-473403.firebaseapp.com
    - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
      value: agents-473403.firebasestorage.app
    - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
      value: "176890074039"
    - variable: NEXT_PUBLIC_FIREBASE_APP_ID
      value: 1:176890074039:web:49ff6ef11af57ffdb48e32
    - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
      value: G-C4QJTR9MLJ
    - variable: GOOGLE_SEARCH_ENGINE_ID
      value: c78dd08203ae14ccc
